{% extends "base.html" %}

{% block content %}
<h2>Add a new guess</h2>

<form action="/add" method="post">
    <label>Date: </label>
    <input type="date" name="date">

    <label>Game: </label>
    <input type="text" name="game">

    <label>Score: </label>
    <input type="number" name="score">

    <input type="submit" value="Add guess">
</form>

{% endblock %}
